<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>تتبع طلباتي — هشام فؤاد ملك الكريب | أسيوط</title>
  <meta name="description" content="تتبع حالة طلباتك المباشرة من مطعم هشام فؤاد ملك الكريب بأسيوط">
  <meta name="theme-color" content="#031215">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800;900&family=Cairo:wght@400;500;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    .orders-page-wrap {
      padding: 3rem 0 5rem;
      min-height: 80vh;
    }
    .orders-container {
      max-width: 820px;
      margin: 0 auto;
    }
    .order-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      position: relative;
      transition: var(--transition);
    }
    .order-card:hover {
      border-color: var(--border-card-hover);
    }
    .order-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .order-number-title {
      font-family: var(--font-num);
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .order-date-text {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .order-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.95rem;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      font-weight: 800;
    }
    /* Stepper */
    .order-stepper-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 1.5rem 0 1.25rem;
      padding: 0 0.5rem;
      position: relative;
    }
    .stepper-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      position: relative;
      z-index: 2;
    }
    .step-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 2px solid var(--text-dim);
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      transition: var(--transition);
    }
    .stepper-step.completed .step-circle {
      background: var(--primary);
      border-color: var(--primary-light);
      color: #fff;
    }
    .stepper-step.active .step-circle {
      background: var(--accent-gold);
      border-color: var(--accent-gold-hover);
      color: #031215;
      box-shadow: 0 0 15px rgba(245, 166, 35, 0.4);
    }
    .stepper-step.delivered .step-circle {
      background: #10B981;
      border-color: #34D399;
      color: #fff;
    }
    .step-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
    }
    .stepper-step.completed .step-label,
    .stepper-step.active .step-label {
      color: #fff;
    }
    .stepper-line {
      flex: 1;
      height: 2px;
      background: var(--border-subtle);
      margin: 0 0.5rem -1.2rem;
      position: relative;
      z-index: 1;
    }
    .stepper-line.completed {
      background: linear-gradient(90deg, var(--primary-light), var(--accent-gold));
    }
    /* Items in order */
    .order-items-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 1rem;
      margin-top: 1rem;
    }
    .order-item-row {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-bottom: 1px dashed var(--border-subtle);
      font-size: 0.9rem;
    }
    .order-item-row:last-child {
      border-bottom: none;
    }
    .order-totals-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-subtle);
      font-size: 1.1rem;
      font-weight: 800;
    }
    .empty-orders-state {
      text-align: center;
      padding: 4rem 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-lg);
    }
  </style>
</head>
<body class="menu-page-body">

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="nav-brand" aria-label="هشام فؤاد الرئيسية">
        <div class="brand-crepe-icon">
          <img src="assets/images/logo.png" alt="لوجو هشام فؤاد ملك الكريب" class="brand-logo-img">
        </div>
        <div class="brand-names">
          <span class="brand-ar">هشام فؤاد</span>
          <span class="brand-en"><i class="fas fa-crown" style="color:var(--accent-gold);margin-left:4px;"></i> KING OF CREPE</span>
        </div>
      </a>

      <div class="nav-actions" style="display:flex; align-items:center; gap:0.85rem;">
        <button type="button" class="nav-auth-btn" id="btnOrdersChangePw" style="cursor:pointer;">
          <i class="fas fa-key"></i>
          <span>تغيير كلمة المرور</span>
        </button>
        <a href="menu.html" class="auth-nav-link">
          <i class="fas fa-arrow-right"></i>
          <span>الرجوع للمنيو</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Orders Content -->
  <main class="orders-page-wrap">
    <div class="container orders-container">
      <div class="menu-title-block" style="text-align: right; margin-bottom: 2rem;">
        <span class="menu-pre-title">سجل ومتابعة الأوردرات</span>
        <h2 class="menu-main-title">
          <i class="fas fa-receipt" style="color:var(--accent-gold); margin-left:8px;"></i>
          طلباتي
        </h2>
      </div>

      <div id="ordersListContainer">
        <div style="text-align:center; color:var(--text-muted); padding:3rem 1rem;">
          <i class="fas fa-spinner fa-spin" style="font-size:2rem; color:var(--accent-gold); margin-bottom:1rem;"></i>
          <p>جاري تحميل سجل طلباتك...</p>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
