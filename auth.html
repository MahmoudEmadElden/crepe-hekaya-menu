<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>تسجيل الدخول — كريب حكاية | Crepe Hekaya</title>

  <meta name="description" content="سجل دخولك أو أنشئ حساب جديد لتقدر تطلب من مطعم كريب حكاية أونلاين.">
  <meta name="theme-color" content="#0C0C0E">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- Minimal Navbar -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="/" class="nav-brand" aria-label="كريب حكاية الرئيسية">
        <div class="brand-crepe-icon">
          <img src="assets/images/logo.jpeg?v=3" alt="لوجو مطعم كريب حكاية" class="brand-logo-img">
        </div>
        <div class="brand-names">
          <span class="brand-ar">كريب حكاية</span>
          <span class="brand-en">CREPE HEKAYA</span>
        </div>
      </a>
      <div class="nav-actions">
        <a href="/" class="auth-nav-link">← الرجوع للمنيو</a>
      </div>
    </div>
  </header>

  <!-- Auth Container -->
  <main class="auth-main">
    <div class="auth-card">

      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTab" data-tab="login">تسجيل الدخول</button>
        <button class="auth-tab" id="registerTab" data-tab="register">حساب جديد</button>
      </div>

      <!-- Login Form -->
      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label for="loginUsername">اسم المستخدم</label>
          <input type="text" id="loginUsername" name="username" placeholder="ادخل اسم المستخدم" required autocomplete="username" minlength="3" maxlength="30">
        </div>
        <div class="form-group">
          <label for="loginPassword">كلمة المرور</label>
          <div class="password-input-wrapper">
            <input type="password" id="loginPassword" name="password" placeholder="ادخل كلمة المرور" required minlength="6">
            <button type="button" class="btn-toggle-pw" aria-label="إظهار/إخفاء كلمة المرور" onclick="togglePasswordVisibility('loginPassword', this)">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>
        <div class="form-error" id="loginError"></div>
        <button type="submit" class="auth-submit-btn" id="loginSubmitBtn">
          <span class="btn-text">دخول</span>
          <span class="btn-loading" style="display:none;">جارٍ التحميل...</span>
        </button>
      </form>

      <!-- Register Form -->
      <form class="auth-form" id="registerForm" style="display: none;">
        <div class="form-group">
          <label for="regDisplayName">الاسم بالكامل <span class="required">*</span></label>
          <input type="text" id="regDisplayName" name="displayName" placeholder="ادخل اسمك بالكامل (مثال: أحمد محمد)" required maxlength="50">
        </div>

        <div class="form-group">
          <label for="regAddress">العنوان بالتفصيل <span class="required">*</span></label>
          <input type="text" id="regAddress" name="address" placeholder="المنطقة، الشارع، رقم العمارة، الشقة، علامة مميزة" required minlength="5" maxlength="200">
        </div>

        <div class="form-group">
          <label for="regPhone">رقم التليفون <span class="required">*</span></label>
          <input type="tel" id="regPhone" name="phone" placeholder="01xxxxxxxxx" required dir="ltr" pattern="^01[0125][0-9]{8}$" title="يرجى إدخال رقم هاتف صحيح مكون من 11 رقم">
        </div>

        <div class="form-group">
          <label for="regUsername">اسم المستخدم <span class="required">*</span></label>
          <input type="text" id="regUsername" name="username" placeholder="اختار اسم مستخدم (3 حروف على الأقل)" required autocomplete="username" minlength="3" maxlength="30">
        </div>

        <div class="form-group">
          <label for="regPassword">كلمة المرور <span class="required">*</span></label>
          <div class="password-input-wrapper">
            <input type="password" id="regPassword" name="password" placeholder="اختار كلمة مرور (6 خانات على الأقل)" required minlength="6">
            <button type="button" class="btn-toggle-pw" aria-label="إظهار/إخفاء كلمة المرور" onclick="togglePasswordVisibility('regPassword', this)">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="regConfirmPassword">تأكيد كلمة المرور <span class="required">*</span></label>
          <div class="password-input-wrapper">
            <input type="password" id="regConfirmPassword" name="confirmPassword" placeholder="أعد كتابة كلمة المرور" required minlength="6">
            <button type="button" class="btn-toggle-pw" aria-label="إظهار/إخفاء كلمة المرور" onclick="togglePasswordVisibility('regConfirmPassword', this)">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <div class="form-error" id="registerError"></div>
        <button type="submit" class="auth-submit-btn" id="registerSubmitBtn">
          <span class="btn-text">إنشاء الحساب</span>
          <span class="btn-loading" style="display:none;">جارٍ التحميل...</span>
        </button>
      </form>

    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
